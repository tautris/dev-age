<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>How much experience?</title>
  <meta name="description" content="How much software development experience does Tautrimas Gumbys have?"/>
  <meta name="author" content="Tautrimas Gumbys"/>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="./favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script src="index.mjs" type="module"></script>
</head>
<body>
<main>
  <h1>How much software development experience does Tautrimas Gumbys have?</h1>

  <p>
    Commercially developing software since <time datetime="2018-09-03T09:00:00+03:00">3 September 2018</time>.
  </p>

  <form id="calculator">
    <fieldset>
      <legend>Calculation engine</legend>

      <label>
        <input
          id="engine-dayjs"
          type="radio"
          name="engine"
          value="dayjs"
          checked
        >
        Day.js
      </label>

      <label>
        <input
          id="engine-temporal"
          type="radio"
          name="engine"
          value="temporal"
        >
        Temporal API
      </label>
    </fieldset>

    <p>
      <output
        id="duration"
        for="engine-dayjs engine-temporal"
        aria-live="off"
      >
        Calculating experience…
      </output>
    </p>

    <p id="engine-error" role="alert" hidden></p>
  </form>
</main>
</body>
</html>
